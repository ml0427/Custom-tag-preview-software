name: Release Windows installer

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Manual reruns must select a version tag, never publish a branch as a release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Validate release version and signing setup
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Missing TAURI_SIGNING_PRIVATE_KEY repository secret' }
          npm run version:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frontend checks
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint:css
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Tauri's generate_context! embeds frontendDist during cargo test too.
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --bin app
      - name: Build signed installer and draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Custom Tag Preview ${{ github.ref_name }}
          releaseBody: '首次使用請下載 setup.exe 安裝；之後可在程式內自動更新。'
          releaseDraft: true
          prerelease: false
          args: --bundles nsis -- --locked
          updaterJsonPreferNsis: true
      - name: Validate update manifest before publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release download $env:RELEASE_TAG --pattern latest.json --dir release-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/validate-update-manifest.cjs release-check/latest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit $env:RELEASE_TAG --draft=false --latest
